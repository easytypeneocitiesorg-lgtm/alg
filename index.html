<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Remote</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div
        id="passwordOverlay"
        class="hidden"
    >

        <div id="passwordBox">

            <input
                id="passwordInput"
                type="password"
                placeholder="Password"
                autocomplete="off"
            >

            <button id="passwordButton">
                Enter
            </button>

            <div id="passwordError"></div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
