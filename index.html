<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="passwordOverlay" class="hidden">
    <div id="passwordBox">
        <input
            id="passwordInput"
            type="password"
            placeholder="Password"
            autocomplete="off"
        >

        <button id="passwordButton">
            Enter
        </button>

        <div id="passwordError"></div>
    </div>
</div>

<script>
    const overlay = document.getElementById("passwordOverlay");
    const passwordInput = document.getElementById("passwordInput");
    const passwordButton = document.getElementById("passwordButton");
    const passwordError = document.getElementById("passwordError");

    let unlocked = false;

    // Press K anywhere on the page
    document.addEventListener("keydown", function(event) {

        console.log("Key pressed:", event.key);

        if (event.key.toLowerCase() !== "k") {
            return;
        }

        if (unlocked) {
            return;
        }

        overlay.classList.remove("hidden");

        passwordInput.value = "";
        passwordError.textContent = "";

        passwordInput.focus();
    });


    passwordButton.addEventListener("click", checkPassword);


    passwordInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            checkPassword();
        }

        if (event.key === "Escape") {
            overlay.classList.add("hidden");
        }
    });


    async function checkPassword() {

        if (passwordInput.value !== "Cinnamon279") {

            passwordError.textContent =
                "Incorrect password.";

            passwordInput.value = "";

            passwordInput.focus();

            return;
        }

        unlocked = true;

        overlay.classList.add("hidden");

        await openAlg();
    }


    async function openAlg() {

        try {

            const response = await fetch("alg.yaml");

            if (!response.ok) {
                throw new Error(
                    "Could not load alg.yaml (" +
                    response.status +
                    ")"
                );
            }

            const html = await response.text();

            const tab = window.open(
                "about:blank",
                "_blank"
            );

            if (!tab) {
                alert("Popup blocked.");
                return;
            }

            tab.document.open();
            tab.document.write(html);
            tab.document.close();

        } catch (error) {

            console.error(error);

            alert(
                "Could not load alg.yaml:\n\n" +
                error.message
            );
        }
    }
</script>

</body>
</html>
