<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phone Remote</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#screen {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #000;
}

#status {
    position: fixed;
    top: 12px;
    left: 12px;

    padding: 8px 12px;

    background: rgba(0, 0, 0, 0.75);
    color: white;

    border-radius: 6px;

    font-family: monospace;
    font-size: 14px;

    z-index: 100;
}

#status.connected {
    color: #6cff8d;
}

#status.error {
    color: #ff6c6c;
}
</style>

</head>

<body>

<div id="status">Connecting...</div>

<video
    id="screen"
    autoplay
    playsinline
    muted
></video>

<script>

/* ============================================================
   CONFIGURATION
   ============================================================ */

/*
 * This MUST be the URL of your Cloudflare tunnel
 * pointing to remote.py.
 */

const SERVER =
    "https://win-deposit-emotional-delegation.trycloudflare.com";


const WEBSOCKET_SERVER =
    "https://win-deposit-emotional-delegation.trycloudflare.com";


/* ============================================================
   ELEMENTS
   ============================================================ */

const screen =
    document.getElementById("screen");

const status =
    document.getElementById("status");


let websocket = null;
let peer = null;


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(
    text,
    type = ""
) {

    status.textContent = text;

    status.className = type;

}


/* ============================================================
   CONNECT WEBSOCKET
   ============================================================ */

function connectWebSocket() {

    websocket =
        new WebSocket(
            WEBSOCKET_SERVER
        );


    websocket.onopen = () => {

        console.log(
            "Control WebSocket connected."
        );

    };


    websocket.onclose = () => {

        console.log(
            "Control WebSocket disconnected."
        );

        setTimeout(
            connectWebSocket,
            2000
        );

    };


    websocket.onerror = error => {

        console.error(
            "WebSocket error:",
            error
        );

    };

}


/* ============================================================
   SEND CONTROL EVENT
   ============================================================ */

function sendControl(
    data
) {

    if (
        !websocket ||
        websocket.readyState !==
        WebSocket.OPEN
    ) {

        return;

    }

    websocket.send(
        JSON.stringify(data)
    );

}


/* ============================================================
   START WEBRTC VIDEO
   ============================================================ */

async function startVideo() {

    setStatus(
        "Connecting to scrcpy..."
    );


    peer =
        new RTCPeerConnection();


    /*
     * We only receive video.
     */

    peer.addTransceiver(
        "video",
        {
            direction: "recvonly"
        }
    );


    /*
     * WebRTC gives us the actual live video
     * stream from remote.py.
     */

    peer.ontrack = event => {

        console.log(
            "Received video track."
        );


        if (
            event.streams &&
            event.streams.length > 0
        ) {

            screen.srcObject =
                event.streams[0];

        }

    };


    peer.onconnectionstatechange = () => {

        console.log(
            "WebRTC state:",
            peer.connectionState
        );


        switch (
            peer.connectionState
        ) {

            case "connected":

                setStatus(
                    "Connected",
                    "connected"
                );

                break;


            case "connecting":

                setStatus(
                    "Connecting..."
                );

                break;


            case "disconnected":

                setStatus(
                    "Disconnected",
                    "error"
                );

                break;


            case "failed":

                setStatus(
                    "Connection failed",
                    "error"
                );

                break;

        }

    };


    /*
     * Create WebRTC offer.
     */

    const offer =
        await peer.createOffer();


    await peer.setLocalDescription(
        offer
    );


    /*
     * Send offer to Python.
     */

    const response =
        await fetch(
            SERVER + "/offer",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    sdp:
                        peer.localDescription.sdp,

                    type:
                        peer.localDescription.type
                })
            }
        );


    if (!response.ok) {

        throw new Error(
            "Server returned HTTP " +
            response.status
        );

    }


    const answer =
        await response.json();


    await peer.setRemoteDescription(
        new RTCSessionDescription(
            answer
        )
    );


    console.log(
        "WebRTC negotiation complete."
    );

}


/* ============================================================
   GET PHONE COORDINATES
   ============================================================ */

function getPhoneCoordinates(
    event
) {

    const rect =
        screen.getBoundingClientRect();


    const videoWidth =
        screen.videoWidth;

    const videoHeight =
        screen.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {

        return null;

    }


    /*
     * The video uses object-fit: contain.
     *
     * Calculate the actual displayed video
     * area so clicks aren't offset by black bars.
     */

    const scale =
        Math.min(

            rect.width / videoWidth,

            rect.height / videoHeight

        );


    const displayedWidth =
        videoWidth * scale;

    const displayedHeight =
        videoHeight * scale;


    const offsetX =
        (
            rect.width -
            displayedWidth
        ) / 2;


    const offsetY =
        (
            rect.height -
            displayedHeight
        ) / 2;


    const x =
        (
            event.clientX -
            rect.left -
            offsetX
        ) / scale;


    const y =
        (
            event.clientY -
            rect.top -
            offsetY
        ) / scale;


    /*
     * Ignore clicks in the black bars.
     */

    if (
        x < 0 ||
        y < 0 ||
        x > videoWidth ||
        y > videoHeight
    ) {

        return null;

    }


    return {
        x: Math.round(x),
        y: Math.round(y)
    };

}


/* ============================================================
   LEFT CLICK
   ============================================================ */

screen.addEventListener(
    "click",
    event => {

        const pos =
            getPhoneCoordinates(
                event
            );


        if (!pos)
            return;


        sendControl({

            type: "click",

            x: pos.x,

            y: pos.y

        });

    }
);


/* ============================================================
   RIGHT CLICK
   ============================================================ */

screen.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();


        const pos =
            getPhoneCoordinates(
                event
            );


        if (!pos)
            return;


        sendControl({

            type: "rightclick",

            x: pos.x,

            y: pos.y

        });

    }
);


/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        /*
         * Don't interfere with actual
         * text fields if we add any later.
         */

        if (
            event.target.tagName ===
            "INPUT" ||

            event.target.tagName ===
            "TEXTAREA"
        ) {

            return;

        }


        event.preventDefault();


        sendControl({

            type: "key",

            key: event.key

        });

    }
);


/* ============================================================
   START
   ============================================================ */

connectWebSocket();


startVideo().catch(
    error => {

        console.error(
            "Video error:",
            error
        );

        setStatus(
            "Could not connect to scrcpy",
            "error"
        );

    }
);

</script>

</body>

</html>
