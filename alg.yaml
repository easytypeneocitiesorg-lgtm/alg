<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Remote Desktop</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#screen {
    width: 100vw;
    height: 100vh;

    object-fit: contain;

    display: block;

    background: black;

    cursor: default;
}

#status {
    position: fixed;

    top: 10px;
    left: 10px;

    padding: 8px 12px;

    background: rgba(0,0,0,.7);

    color: white;

    font-family: monospace;

    font-size: 13px;

    border-radius: 5px;

    z-index: 10;
}

</style>
</head>

<body>

<div id="status">
    Connecting...
</div>

<video
    id="screen"
    autoplay
    playsinline
></video>

<script>

const SERVER =
    "https://win-deposit-emotional-delegation.trycloudflare.com";

const WS_SERVER =
    SERVER.replace(
        "https://",
        "wss://"
    ) + "/ws";

const video =
    document.getElementById(
        "screen"
    );

const status =
    document.getElementById(
        "status"
    );


let websocket = null;
let peer = null;


/* ==========================================================
   STATUS
========================================================== */

function setStatus(text) {

    status.textContent = text;

}


/* ==========================================================
   WEBSOCKET
========================================================== */

function connectWebSocket() {

    websocket =
        new WebSocket(
            WS_SERVER
        );

    websocket.onopen = () => {

        console.log(
            "Control WebSocket connected."
        );

    };

    websocket.onclose = () => {

        console.log(
            "Control WebSocket disconnected."
        );

    };

    websocket.onerror = error => {

        console.error(
            "WebSocket error:",
            error
        );

    };

}


/* ==========================================================
   SEND CONTROL EVENT
========================================================== */

function send(data) {

    if (
        websocket &&
        websocket.readyState ===
        WebSocket.OPEN
    ) {

        websocket.send(
            JSON.stringify(data)
        );

    }

}


/* ==========================================================
   WEBRTC
========================================================== */

async function startVideo() {

    setStatus(
        "Connecting to PC..."
    );

    peer =
        new RTCPeerConnection();

    peer.ontrack = event => {

        console.log(
            "Received video track."
        );

        video.srcObject =
            event.streams[0];

        setStatus(
            "Connected"
        );

    };


    peer.onconnectionstatechange =
        () => {

            console.log(
                "WebRTC:",
                peer.connectionState
            );

            if (
                peer.connectionState ===
                "connected"
            ) {

                setStatus(
                    "Connected"
                );

            }

            if (
                peer.connectionState ===
                "failed"
            ) {

                setStatus(
                    "WebRTC connection failed"
                );

            }

        };


    /*
       We only want to RECEIVE video.
    */

    peer.addTransceiver(
        "video",
        {
            direction: "recvonly"
        }
    );


    const offer =
        await peer.createOffer();

    await peer.setLocalDescription(
        offer
    );


    /*
       Wait for ICE gathering.
    */

    await new Promise(
        resolve => {

            if (
                peer.iceGatheringState ===
                "complete"
            ) {

                resolve();

                return;
            }


            function check() {

                if (
                    peer.iceGatheringState ===
                    "complete"
                ) {

                    peer.removeEventListener(
                        "icegatheringstatechange",
                        check
                    );

                    resolve();

                }

            }


            peer.addEventListener(
                "icegatheringstatechange",
                check
            );

        }
    );


    const response =
        await fetch(
            SERVER + "/offer",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify(
                    peer.localDescription
                )

            }
        );


    if (!response.ok) {

        throw new Error(
            "Server returned " +
            response.status
        );

    }


    const answer =
        await response.json();


    await peer.setRemoteDescription(
        answer
    );


    console.log(
        "WebRTC negotiation complete."
    );

}


/* ==========================================================
   MOUSE COORDINATES
========================================================== */

function getScreenCoordinates(event) {

    const rect =
        video.getBoundingClientRect();


    /*
       Video uses object-fit: contain.

       Work out the actual displayed
       video rectangle inside the element.
    */

    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {

        return null;

    }


    const elementWidth =
        rect.width;

    const elementHeight =
        rect.height;


    const videoAspect =
        videoWidth /
        videoHeight;

    const elementAspect =
        elementWidth /
        elementHeight;


    let displayedWidth;
    let displayedHeight;

    let offsetX;
    let offsetY;


    if (
        videoAspect >
        elementAspect
    ) {

        displayedWidth =
            elementWidth;

        displayedHeight =
            elementWidth /
            videoAspect;

        offsetX = 0;

        offsetY =
            (
                elementHeight -
                displayedHeight
            ) / 2;

    } else {

        displayedHeight =
            elementHeight;

        displayedWidth =
            elementHeight *
            videoAspect;

        offsetX =
            (
                elementWidth -
                displayedWidth
            ) / 2;

        offsetY = 0;

    }


    const x =
        (
            event.clientX -
            rect.left -
            offsetX
        ) /
        displayedWidth *
        videoWidth;


    const y =
        (
            event.clientY -
            rect.top -
            offsetY
        ) /
        displayedHeight *
        videoHeight;


    return {

        x: Math.max(
            0,
            Math.min(
                videoWidth,
                x
            )
        ),

        y: Math.max(
            0,
            Math.min(
                videoHeight,
                y
            )
        )

    };

}


/* ==========================================================
   MOUSE MOVE
========================================================== */

video.addEventListener(
    "mousemove",
    event => {

        const pos =
            getScreenCoordinates(
                event
            );

        if (!pos)
            return;


        send({

            type:
                "mouse_move",

            x:
                pos.x,

            y:
                pos.y

        });

    }
);


/* ==========================================================
   MOUSE BUTTONS
========================================================== */

video.addEventListener(
    "mousedown",
    event => {

        event.preventDefault();


        const button =
            event.button === 2
                ? "right"
                : "left";


        const pos =
            getScreenCoordinates(
                event
            );


        if (!pos)
            return;


        send({

            type:
                "mouse_move",

            x:
                pos.x,

            y:
                pos.y

        });


        send({

            type:
                "mouse_down",

            button:
                button

        });

    }
);


video.addEventListener(
    "mouseup",
    event => {

        event.preventDefault();


        const button =
            event.button === 2
                ? "right"
                : "left";


        send({

            type:
                "mouse_up",

            button:
                button

        });

    }
);


/* Disable browser context menu */

video.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);


/* ==========================================================
   MOUSE WHEEL
========================================================== */

video.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        send({

            type:
                "mouse_scroll",

            amount:
                Math.round(
                    -event.deltaY / 40
                )

        });

    },
    {
        passive: false
    }
);


/* ==========================================================
   KEYBOARD
========================================================== */

document.addEventListener(
    "keydown",
    event => {

        /*
           Don't let the browser interpret
           things like Ctrl+L, F5, etc.
        */

        event.preventDefault();


        let key =
            event.key;


        /*
           pyautogui uses names such as:

           enter
           escape
           backspace
           shift
           ctrl
           alt
           tab
           space
           up
           down
           left
           right
        */

        const mapping = {

            "Enter":
                "enter",

            "Escape":
                "esc",

            "Backspace":
                "backspace",

            "Tab":
                "tab",

            "Shift":
                "shift",

            "Control":
                "ctrl",

            "Alt":
                "alt",

            "Meta":
                "win",

            " ":
                "space",

            "ArrowUp":
                "up",

            "ArrowDown":
                "down",

            "ArrowLeft":
                "left",

            "ArrowRight":
                "right",

            "Delete":
                "delete",

            "Home":
                "home",

            "End":
                "end",

            "PageUp":
                "pageup",

            "PageDown":
                "pagedown",

            "Insert":
                "insert",

            "CapsLock":
                "capslock",

            "F1":
                "f1",

            "F2":
                "f2",

            "F3":
                "f3",

            "F4":
                "f4",

            "F5":
                "f5",

            "F6":
                "f6",

            "F7":
                "f7",

            "F8":
                "f8",

            "F9":
                "f9",

            "F10":
                "f10",

            "F11":
                "f11",

            "F12":
                "f12"

        };


        if (
            mapping[key]
        ) {

            key =
                mapping[key];

        }


        send({

            type:
                "key_down",

            key:
                key.toLowerCase()

        });

    }
);


document.addEventListener(
    "keyup",
    event => {

        event.preventDefault();


        let key =
            event.key;


        const mapping = {

            "Enter":
                "enter",

            "Escape":
                "esc",

            "Backspace":
                "backspace",

            "Tab":
                "tab",

            "Shift":
                "shift",

            "Control":
                "ctrl",

            "Alt":
                "alt",

            "Meta":
                "win",

            " ":
                "space",

            "ArrowUp":
                "up",

            "ArrowDown":
                "down",

            "ArrowLeft":
                "left",

            "ArrowRight":
                "right",

            "Delete":
                "delete",

            "Home":
                "home",

            "End":
                "end",

            "PageUp":
                "pageup",

            "PageDown":
                "pagedown",

            "Insert":
                "insert",

            "CapsLock":
                "capslock",

            "F1":
                "f1",

            "F2":
                "f2",

            "F3":
                "f3",

            "F4":
                "f4",

            "F5":
                "f5",

            "F6":
                "f6",

            "F7":
                "f7",

            "F8":
                "f8",

            "F9":
                "f9",

            "F10":
                "f10",

            "F11":
                "f11",

            "F12":
                "f12"

        };


        if (
            mapping[key]
        ) {

            key =
                mapping[key];

        }


        send({

            type:
                "key_up",

            key:
                key.toLowerCase()

        });

    }
);


/* ==========================================================
   START
========================================================== */

connectWebSocket();

startVideo()
    .catch(error => {

        console.error(
            "Video error:",
            error
        );

        setStatus(
            "Connection failed"
        );

    });

</script>

</body>
</html>
